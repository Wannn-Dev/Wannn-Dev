<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Engineering priorities for batch data workflows</title>
  <desc id="desc">Traceability comes from input and output checks, efficiency from query and memory tuning, and reliable delivery from repeatable jobs and stable API contracts.</desc>
  <rect x="1" y="1" width="898" height="248" rx="20" fill="#0c1526" stroke="#334863" stroke-width="2"/>
  <text x="36" y="49" fill="#eaf3ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Engineering priorities</text>
  <path d="M65 81h568" stroke="#445a76" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(35 104)">
      <rect width="262" height="115" rx="13" fill="#121f34" stroke="#344963"/>
      <path d="M30-23V0" stroke="#5eddf7" stroke-width="2"/>
      <circle cx="30" cy="-23" r="5" fill="#5eddf7"/>
      <text x="18" y="36" fill="#80e6fb" font-size="23" font-weight="700">Traceability</text>
      <text x="18" y="69" fill="#c3d4e9" font-size="20">Input checks</text>
      <text x="18" y="95" fill="#c3d4e9" font-size="20">Output reconciliation</text>
    </g>
    <g transform="translate(319 104)">
      <rect width="262" height="115" rx="13" fill="#121f34" stroke="#344963"/>
      <path d="M30-23V0" stroke="#65e7bf" stroke-width="2"/>
      <circle cx="30" cy="-23" r="5" fill="#65e7bf"/>
      <text x="18" y="36" fill="#79ebc7" font-size="23" font-weight="700">Efficiency</text>
      <text x="18" y="69" fill="#c3d4e9" font-size="20">Query tuning</text>
      <text x="18" y="95" fill="#c3d4e9" font-size="20">Memory-aware processing</text>
    </g>
    <g transform="translate(603 104)">
      <rect width="262" height="115" rx="13" fill="#121f34" stroke="#344963"/>
      <path d="M30-23V0" stroke="#bba6fa" stroke-width="2"/>
      <circle cx="30" cy="-23" r="5" fill="#bba6fa"/>
      <text x="18" y="36" fill="#cbbafb" font-size="23" font-weight="700">Delivery</text>
      <text x="18" y="69" fill="#c3d4e9" font-size="20">Repeatable jobs</text>
      <text x="18" y="95" fill="#c3d4e9" font-size="20">Stable API contracts</text>
    </g>
  </g>
</svg>
